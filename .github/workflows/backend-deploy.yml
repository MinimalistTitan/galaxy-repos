name: backend-deploy

on:
  pull_request:
    branches:
      - dev
      - test
      - main
    paths:
      - apps/backend/galaxy-api/**
      - .github/workflows/backend-deploy.yml
  push:
    branches:
      - dev
      - test
      - main
    paths:
      - apps/backend/galaxy-api/**
      - .github/workflows/backend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  API_PROJECT: apps/backend/galaxy-api/galaxy-api/galaxy-api.csproj

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore

  package:
    name: Package backend
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output api-publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: api-publish

  deploy_develop:
    name: Deploy backend to develop
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    environment: develop

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: api-publish

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api-publish

      - name: Smoke test API
        run: curl --fail --silent --show-error "${{ vars.AZURE_API_BASE_URL }}/api/health"

  deploy_test:
    name: Deploy backend to test
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/test'
    environment: test

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: api-publish

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api-publish

      - name: Smoke test API
        run: curl --fail --silent --show-error "${{ vars.AZURE_API_BASE_URL }}/api/health"

  deploy_production:
    name: Deploy backend to production
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: api-publish

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api-publish

      - name: Smoke test API
        run: curl --fail --silent --show-error "${{ vars.AZURE_API_BASE_URL }}/api/health"

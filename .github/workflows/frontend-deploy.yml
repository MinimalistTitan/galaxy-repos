name: frontend-deploy

on:
  pull_request:
    branches:
      - dev
      - test
      - main
    paths:
      - apps/frontend/galaxy-app/**
      - .github/workflows/frontend-deploy.yml
  push:
    branches:
      - dev
      - test
      - main
    paths:
      - apps/frontend/galaxy-app/**
      - .github/workflows/frontend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.x
  FRONTEND_PATH: apps/frontend/galaxy-app

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_API_BASE_URL: http://localhost:5166

  deploy_develop:
    name: Deploy frontend to develop
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    environment: develop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_API_BASE_URL: ${{ vars.AZURE_API_BASE_URL }}

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ${{ env.FRONTEND_PATH }}/dist
          output_location: ''
          skip_app_build: true

      - name: Smoke test frontend
        run: curl --fail --silent --show-error "${{ vars.AZURE_STATIC_WEB_APP_URL }}"

  deploy_test:
    name: Deploy frontend to test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/test'
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_API_BASE_URL: ${{ vars.AZURE_API_BASE_URL }}

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ${{ env.FRONTEND_PATH }}/dist
          output_location: ''
          skip_app_build: true

      - name: Smoke test frontend
        run: curl --fail --silent --show-error "${{ vars.AZURE_STATIC_WEB_APP_URL }}"

  deploy_production:
    name: Deploy frontend to production
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_API_BASE_URL: ${{ vars.AZURE_API_BASE_URL }}

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ${{ env.FRONTEND_PATH }}/dist
          output_location: ''
          skip_app_build: true

      - name: Smoke test frontend
        run: curl --fail --silent --show-error "${{ vars.AZURE_STATIC_WEB_APP_URL }}"
